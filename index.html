    <style>
      :root {
        --bg: #f5f3ef;
        --fg: #16181d;
        --mut: #6a6f7a;
        --card: #fff;
        --line: #e2ded6;
        --acc: #d6281f;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f1115;
          --fg: #f1efe9;
          --mut: #9aa0ac;
          --card: #181b22;
          --line: #2a2e38;
          --acc: #ff5a4d;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f1115;
        --fg: #f1efe9;
        --mut: #9aa0ac;
        --card: #181b22;
        --line: #2a2e38;
        --acc: #ff5a4d;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 "Helvetica Neue",
          Arial,
          sans-serif;
      }
      header {
        padding: 56px 6vw 24px;
        max-width: 1200px;
        margin: auto;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3.6rem);
        line-height: 1.05;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      header p {
        color: var(--mut);
        margin: 0;
        max-width: 80ch;
      }
      header b {
        color: var(--acc);
      }
      section {
        max-width: 1200px;
        margin: auto;
        padding: 28px 0 8px;
      }
      .hd {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 0 6vw;
        gap: 12px;
      }
      h2 {
        font-size: 1.25rem;
        margin: 0;
      }
      .hd small {
        color: var(--mut);
      }
      .nav button {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        margin-left: 6px;
      }
      .nav button:hover {
        border-color: var(--acc);
        color: var(--acc);
      }
      .track {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 16px 6vw 20px;
        scroll-padding-inline: 6vw;
        scrollbar-width: thin;
      }
      .card {
        flex: 0 0 min(260px, 72vw);
        scroll-snap-align: start;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.2s,
          border-color 0.2s;
      }
      .card:hover {
        transform: translateY(-4px);
        border-color: var(--acc);
      }
      .th {
        aspect-ratio: 16/10;
        padding: 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #fff;
        position: relative;
      }
      .th span {
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.85;
      }
      .th i {
        position: absolute;
        right: 14px;
        bottom: 14px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        color: #111;
        display: grid;
        place-items: center;
        font-style: normal;
        font-size: 14px;
      }
      .bd {
        padding: 12px 14px 14px;
      }
      .bd h3 {
        font-size: 0.95rem;
        margin: 0 0 4px;
        line-height: 1.3;
      }
      .bd p {
        margin: 0;
        color: var(--mut);
        font-size: 0.82rem;
      }
      footer {
        max-width: 1200px;
        margin: 32px auto 48px;
        padding: 0 6vw;
        color: var(--mut);
        font-size: 0.85rem;
      }
    </style>

      // Fotos (werden über die Admin-Seite verwaltet): Titel -> Bild
      var IMG = {
      };
      // YouTube-Video-ID aus Link ermitteln
      function yt(u) {
        var m =
          u &&
          u.match(/(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/)([\w-]{11})/);
        return m && m[1];
      }
      function setBg(el, url) {
        el.style.background = 'center/cover no-repeat url("' + url + '")';
      }
      // Eigenes Foto hat Vorrang, sonst automatisch das YouTube-Vorschaubild
      function setThumb(el, r) {
        if (IMG[r[0]]) return setBg(el, IMG[r[0]]);
        var id = yt(r[3]);
        if (!id) return;
        var base = "https://i.ytimg.com/vi/" + id + "/";
        var im = new Image();
        im.onload = function () {
          if (im.naturalWidth < 200 && im.src.indexOf("maxres") > -1)
            im.src = base + "mqdefault.jpg";
          else setBg(el, im.src);
        };
        im.onerror = function () {
          if (im.src.indexOf("maxres") > -1) im.src = base + "mqdefault.jpg";
        };
        im.src = base + "maxresdefault.jpg";
      }
      function hue(s) {
        var h = 0;
        for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
        return h;
      }
      var m = document.getElementById("m");
      G.forEach(function (g) {
        var rows = g[2].split("\n").map(function (r) {
          return r.split("|");
        });
        var s = document.createElement("section");
        s.innerHTML =
          '<div class="hd"><div><h2></h2><small>' +
          rows.length +
          ' Beiträge</small></div><div class="nav"><button aria-label="zurück">‹</button><button aria-label="weiter">›</button></div></div><div class="track"></div>';
        s.querySelector("h2").textContent = g[0];
        var t = s.querySelector(".track");
        rows.forEach(function (r) {
          var a = document.createElement(r[3] ? "a" : "article");
          a.className = "card";
          if (r[3]) {
            a.href = r[3];
            a.target = "_blank";
            a.rel = "noopener";
          }
          var h = hue(r[0]);
          a.innerHTML =
            '<div class="th" style="background:linear-gradient(135deg,hsl(' +
            h +
            ",55%,32%),hsl(" +
            ((h + 50) % 360) +
            ',60%,18%))">' +
            (r[3] ? "<i>▶</i>" : "") +
            '</div><div class="bd"><h3></h3><p></p></div>';
          setThumb(a.querySelector(".th"), r);
          a.querySelector("h3").textContent = r[0];
          a.querySelector(".bd p").textContent = r[1] + " · " + r[2];
          t.appendChild(a);
        });
        var b = s.querySelectorAll("button");
        b[0].onclick = function () {
          t.scrollBy({ left: -t.clientWidth * 0.8, behavior: "smooth" });
        };
        b[1].onclick = function () {
          t.scrollBy({ left: t.clientWidth * 0.8, behavior: "smooth" });
        };
        m.appendChild(s);
      });
